<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LabGeo-ITA | Laboratório de Geomática do ITA</title>
  <meta name="description" content="LabGeo-ITA: aplicações de geociências na Engenharia Civil-Aeronáutica — sensoriamento remoto, geotecnia, hidrologia, ecologia e modelagem geoespacial.">
  <link rel="icon" href="./logo_labgeo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <nav id="nav">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between h-20 items-center">
      <a href="#home" class="flex items-center gap-3">
        <img src="./logo_labgeo.png" alt="LabGeo-ITA" class="h-12 w-auto">
      </a>
      <div id="socials" class="socials hidden sm:flex mr-auto ml-6"></div>
      <div class="flex items-center gap-4 md:gap-8">
        <div class="hidden md:flex items-center gap-8">
          <a href="#home" class="nav-link" data-i18n="nav_home">Home</a>
          <a href="#pesquisa" class="nav-link" data-i18n="nav_research">Pesquisa</a>
          <a href="#projetos" class="nav-link" data-i18n="nav_projects">Projetos</a>
          <a href="#equipe" class="nav-link" data-i18n="nav_team">Equipe</a>
          <a href="#publicacoes" class="nav-link" data-i18n="nav_pubs">Publicações</a>
        </div>
        <div class="lang"><button id="btn-pt" onclick="setLanguage('pt')">PT</button><button id="btn-en" onclick="setLanguage('en')">EN</button></div>
      </div>
    </div>
  </nav>

  <header id="home" class="hero">
    <div class="relative z-10 max-w-5xl mx-auto text-center">
      <div class="hero-logo"><img src="./logo_labgeo.png" alt="LabGeo-ITA"></div><br>
      <div class="hero-badge"><i class="fa-solid fa-location-dot"></i> ITA • SÃO JOSÉ DOS CAMPOS</div>
      <h1 class="text-4xl md:text-6xl font-extrabold mb-6 leading-tight">
        <span data-i18n="hero_title1">Transformando o Geoespacial em</span><br>
        <span class="grad-gold" data-i18n="hero_title2">Aplicações em Ecologia, Eng. Civil e de Transportes</span>
      </h1>
      <div class="flex flex-col sm:flex-row justify-center gap-4">
        <a href="#pesquisa" class="btn-gold" data-i18n="btn_research">Nossas Pesquisas</a>
        <button onclick="openModal()" class="btn-ghost" data-i18n="btn_collab">Colaborar Conosco</button>
      </div>
    </div>
  </header>

  <main>
    <section id="pesquisa" class="sec">
      <div class="max-w-7xl mx-auto">
        <div class="sec-title"><h2 data-i18n="research_title"></h2><p data-i18n="research_subtitle"></p><div class="bar"></div></div>
        <div id="lines-grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
      </div>
    </section>

    <section id="projetos" class="sec sec-ice">
      <div class="max-w-7xl mx-auto">
        <div class="sec-title"><h2 data-i18n="proj_title"></h2><div class="bar"></div></div>
        <div id="projects-body"></div>
      </div>
    </section>

    <section id="equipe" class="sec">
      <div class="max-w-7xl mx-auto">
        <div class="sec-title"><h2 data-i18n="team_title"></h2><p data-i18n="team_hint"></p><div class="bar"></div></div>
        <div id="leader" class="flex justify-center mb-16"></div>

        <h3 class="sub-title bar-l" data-i18n="title_researchers"></h3>
        <div id="grid-researchers" class="team-grid"></div>

        <h3 class="sub-title bar-l" data-i18n="title_students"></h3>
        <div id="grid-students" class="team-grid"></div>

        <h3 class="sub-title bar-l" data-i18n="title_tech"></h3>
        <div id="grid-tech" class="team-grid"></div>

        <h3 class="sub-title bar-l" data-i18n="title_collaborators"></h3>
        <div id="grid-collab" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>

        <h3 class="sub-title bar-l" data-i18n="title_alumni"></h3>
        <div class="alumni"><div class="grid md:grid-cols-2 gap-8">
          <div><h4 data-i18n="alumni_doctors"></h4><ul id="alumni-post"></ul></div>
          <div><h4 data-i18n="alumni_grad"></h4><ul id="alumni-grad"></ul></div>
        </div></div>
      </div>
    </section>

    <section id="publicacoes" class="sec sec-ice">
      <div class="max-w-6xl mx-auto">
        <div class="sec-title"><h2 data-i18n="pubs_title"></h2><div class="bar"></div></div>
        <div id="pub-tabs" class="flex flex-wrap justify-center gap-2 md:gap-4 mb-10"></div>
        <div id="pub-list"></div>
        <div class="mt-10 text-center">
          <a href="https://scholar.google.com/" target="_blank" rel="noopener" class="text-sm font-bold text-[#0f2a5c] hover:underline" data-i18n="view_more"></a>
        </div>
      </div>
    </section>
  </main>

  <footer id="contato" class="py-12">
    <div class="max-w-7xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-6">
      <div class="text-center md:text-left">
        <span class="text-white font-bold text-lg">LabGeo-<span style="color:#e8a92c">ITA</span></span>
        <p class="text-xs mt-2" data-i18n="footer_a"></p>
        <p class="text-xs mt-1" data-i18n="footer_b"></p>
        <p class="text-xs mt-1">© <span id="year"></span> LabGeo-ITA</p>
      </div>
      <div class="flex gap-6 text-xl">
        <a href="https://github.com/labgeo-ita" target="_blank" rel="noopener" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
        <a href="mailto:emarraut@ita.br" aria-label="E-mail"><i class="fa-solid fa-envelope"></i></a>
      </div>
    </div>
  </footer>

  <!-- Modal de colaboração -->
  <div id="collab-modal" class="hidden fixed inset-0 z-[80] flex items-center justify-center bg-black/50 backdrop-blur-sm">
    <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-md w-full relative mx-4 border-t-4" style="border-color:#e8a92c">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600" aria-label="Fechar"><i class="fa-solid fa-xmark text-xl"></i></button>
      <h3 class="text-xl font-bold mb-2" style="color:#0f2a5c" data-i18n="modal_title"></h3>
      <p class="text-sm text-slate-500 mb-6" data-i18n="modal_desc"></p>
      <div class="space-y-3">
        <a href="mailto:emarraut@ita.br" class="flex items-center justify-center gap-2 w-full py-3 text-white font-semibold rounded-lg hover:opacity-90 transition" style="background:#0f2a5c">
          <i class="fa-solid fa-envelope"></i> <span data-i18n="btn_email_send"></span></a>
        <a href="https://www.civil.ita.br/posgrad/processo_seletivo_ad.php" target="_blank" rel="noopener" class="flex items-center justify-center gap-2 w-full py-3 border border-slate-200 text-slate-600 font-semibold rounded-lg hover:bg-slate-50 transition">
          <i class="fa-solid fa-graduation-cap"></i> <span data-i18n="btn_selection_process"></span></a>
      </div>
    </div>
  </div>

  <!-- Painel lateral: linha / pesquisador / projeto -->
  <aside id="drawer" aria-label="Detalhes">
    <div class="scrim" onclick="closeDrawer()"></div>
    <div class="panel">
      <div class="drawer-bar">
        <button id="drawer-back" class="hidden" onclick="drawerBack()"><i class="fa-solid fa-arrow-left"></i> <span data-i18n="d_back"></span></button>
        <span></span>
        <button onclick="closeDrawer()"><span data-i18n="d_close"></span> <i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="drawer-scroll" class="flex-1 overflow-y-auto"><div id="drawer-content"></div></div>
    </div>
  </aside>

  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
